<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BzhMessenger</title>
<link rel="icon" type="image/png" href="https://www.breizhctf.com/wp-content/uploads/2026/02/cropped-favicon26-300x300.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    --bg-primary: #313338;
    --bg-secondary: #2b2d31;
    --bg-tertiary: #1e1f22;
    --text-normal: #dcddde;
    --text-muted: #949ba4;
    --text-link: #00aff4;
    --brand: #5865f2;
    --brand-hover: #4752c4;
    --green: #23a55a;
    --red: #ed4245;
    --header-height: 48px;
}
html, body { height: 100%; overflow: hidden; }
body {
    background: var(--bg-primary);
    color: var(--text-normal);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-size: 14px;
}
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg-secondary); border-radius: 4px; }
::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 4px; min-height: 40px; }
::-webkit-scrollbar-thumb:hover { background: #111214; }

/* ===== LOGIN ===== */
.login-wrapper {
    display: flex; align-items: center; justify-content: center;
    height: 100vh; background: var(--bg-tertiary);
}
.login-box {
    background: var(--bg-primary); border-radius: 8px; padding: 32px;
    width: 400px; text-align: center;
}
.login-box h2 { margin-bottom: 8px; color: #fff; font-size: 24px; }
.login-box p { color: var(--text-muted); margin-bottom: 20px; font-size: 14px; }
.login-box label {
    display: block; text-align: left; color: var(--text-muted);
    font-size: 12px; font-weight: 700; text-transform: uppercase;
    margin-bottom: 8px; margin-top: 16px;
}
.login-box input {
    width: 100%; padding: 10px 12px; border-radius: 4px;
    border: none; background: var(--bg-tertiary); color: var(--text-normal);
    font-size: 14px; outline: none;
}
.login-box input:focus { outline: 2px solid var(--brand); }
.login-box button {
    width: 100%; padding: 12px; border: none; border-radius: 4px;
    background: var(--brand); color: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer; margin-top: 20px; transition: background 0.15s;
}
.login-box button:hover { background: var(--brand-hover); }
.login-error { color: var(--red); font-size: 13px; margin-top: 8px; display: none; }
.login-logo {
    width: 60px; height: 60px; border-radius: 50%; background: var(--brand);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 700; color: #fff; margin: 0 auto 16px;
}

/* ===== MAIN LAYOUT ===== */
.app { display: flex; height: 100vh; }

.sidebar {
    width: 240px; background: var(--bg-secondary); display: flex;
    flex-direction: column; flex-shrink: 0;
}
.sidebar-header {
    height: var(--header-height); padding: 0 16px;
    display: flex; align-items: center; font-weight: 700; font-size: 15px;
    color: #fff; border-bottom: 1px solid var(--bg-tertiary);
    box-shadow: 0 1px 0 rgba(0,0,0,.2);
}
.channel-list { flex: 1; overflow-y: auto; padding: 8px 0; }
.channel-category {
    padding: 16px 16px 4px; font-size: 11px; font-weight: 700;
    text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.02em;
}
.channel-item {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 12px; margin: 1px 8px; border-radius: 4px;
    cursor: pointer; color: var(--text-muted); font-size: 15px;
    transition: background 0.1s, color 0.1s;
}
.channel-item:hover { background: rgba(79,84,92,.4); color: var(--text-normal); }
.channel-item.active { background: rgba(79,84,92,.6); color: #fff; }
.channel-item .hash { font-size: 18px; font-weight: 400; opacity: .5; }

.user-bar {
    height: 52px; background: rgba(17,18,20,.3); display: flex;
    align-items: center; padding: 0 8px; gap: 8px;
}
.user-avatar {
    width: 32px; height: 32px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-weight: 700;
    font-size: 14px; color: #fff; flex-shrink: 0;
}
.user-info { flex: 1; min-width: 0; }
.user-name { font-size: 13px; font-weight: 600; color: #fff; }
.user-status { font-size: 11px; color: var(--green); }
.logout-btn {
    background: none; border: none; color: var(--text-muted); cursor: pointer;
    font-size: 18px; padding: 4px 8px; border-radius: 4px;
}
.logout-btn:hover { background: rgba(79,84,92,.4); color: var(--text-normal); }
.user-avatar-wrapper { position: relative; }
.online-dot {
    position: absolute; bottom: -1px; right: -1px;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--green); border: 2px solid rgba(17,18,20,.3);
}

.chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.chat-header {
    height: var(--header-height); padding: 0 16px;
    display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid var(--bg-tertiary);
    box-shadow: 0 1px 0 rgba(0,0,0,.2);
}
.chat-header .hash { color: var(--text-muted); font-size: 22px; }
.chat-header .name { font-weight: 700; color: #fff; }
.chat-header .topic { color: var(--text-muted); font-size: 13px; margin-left: 12px; }

.messages {
    flex: 1; overflow-y: auto; padding: 16px 0;
    display: flex; flex-direction: column;
}
.msg {
    padding: 2px 16px; display: flex; gap: 12px;
    margin-top: 4px;
}
.msg { position: relative; }
.msg:hover { background: rgba(0,0,0,.06); }
.msg-actions {
    position: absolute; top: -12px; right: 16px;
    background: var(--bg-secondary); border: 1px solid var(--bg-tertiary);
    border-radius: 4px; display: none; overflow: hidden;
}
.msg:hover .msg-actions { display: flex; }
.msg-action-btn {
    background: none; border: none; color: var(--text-muted);
    cursor: pointer; padding: 4px 8px; font-size: 16px;
}
.msg-action-btn:hover { background: var(--red); color: #fff; }
.msg-divider {
    display: flex; align-items: center; margin: 8px 16px; gap: 8px;
}
.msg-divider hr {
    flex: 1; border: none; border-top: 1px solid rgba(79,84,92,.48);
}
.msg-divider span {
    font-size: 11px; font-weight: 700; color: var(--text-muted);
    white-space: nowrap;
}
.msg-avatar {
    width: 40px; height: 40px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-weight: 700;
    font-size: 16px; color: #fff; flex-shrink: 0; margin-top: 2px;
    overflow: hidden;
}
.msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
.user-avatar { overflow: hidden; }
.user-avatar img { width: 100%; height: 100%; object-fit: cover; }
.msg-body { flex: 1; min-width: 0; }
.msg-meta { display: flex; align-items: baseline; gap: 8px; }
.msg-user { font-weight: 600; font-size: 14px; cursor: pointer; }
.msg-user:hover { text-decoration: underline; }
.msg-time { font-size: 11px; color: var(--text-muted); }
.msg-text { line-height: 1.4; word-wrap: break-word; margin-top: 2px; }
.msg-attachment {
    margin-top: 6px; background: var(--bg-secondary);
    border: 1px solid var(--bg-tertiary); border-radius: 8px;
    overflow: hidden; max-width: 400px; display: inline-block;
}
.msg-attachment img {
    max-width: 100%; max-height: 300px; display: block; cursor: pointer;
}
.msg-attachment-file {
    padding: 10px 14px; display: flex; align-items: center; gap: 8px;
}
.msg-attachment-file a { color: var(--text-link); text-decoration: none; font-size: 14px; }
.msg-attachment-file a:hover { text-decoration: underline; }

.input-area { padding: 0 16px 24px; }
.input-wrapper {
    background: var(--bg-tertiary); border-radius: 8px;
    display: flex; align-items: flex-end; padding: 4px 4px 4px 16px;
}
.input-wrapper textarea {
    flex: 1; background: none; border: none; color: var(--text-normal);
    font-size: 14px; font-family: inherit; resize: none; outline: none;
    padding: 10px 0; max-height: 200px; line-height: 1.4;
}
.input-btns { display: flex; gap: 4px; padding: 4px 0; }
.input-btn {
    width: 36px; height: 36px; border: none; background: none;
    color: var(--text-muted); cursor: pointer; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; transition: color 0.1s;
}
.input-btn:hover { color: var(--text-normal); }
.upload-preview { padding: 8px 16px 0; display: none; }
.upload-preview .preview-card {
    background: var(--bg-secondary); border: 1px solid var(--bg-tertiary);
    border-radius: 8px; padding: 8px 12px; display: inline-flex;
    align-items: center; gap: 8px; font-size: 13px;
}
.upload-preview .remove {
    cursor: pointer; color: var(--red); font-weight: 700; margin-left: 8px;
}
</style>
</head>
<body>

<div id="login-screen" class="login-wrapper">
    <div class="login-box">
        <div class="login-logo"><img src="https://www.breizhctf.com/wp-content/uploads/2026/02/cropped-favicon26-300x300.png" style="width:100%;height:100%;object-fit:cover;border-radius:50%"></div>
        <h2>Welcome back!</h2>
        <p>We're so excited to see you again!</p>
        <label>USERNAME</label>
        <input type="text" id="login-user" autocomplete="off">
        <label>PASSWORD</label>
        <input type="password" id="login-pass">
        <div class="login-error" id="login-error"></div>
        <button onclick="doLogin()">Log In</button>
    </div>
</div>

<div id="app-screen" class="app" style="display:none;">
    <div class="sidebar">
        <div class="sidebar-header"><span>BzhMessenger</span></div>
        <div class="channel-list">
            <div class="channel-category">Text Channels</div>
            <div id="channel-list"></div>
        </div>
        <div class="user-bar">
            <div class="user-avatar-wrapper">
                <div class="user-avatar" id="user-avatar" style="background:#825EFF">P</div>
                <div class="online-dot"></div>
            </div>
            <div class="user-info">
                <div class="user-name" id="user-name">player</div>
                <div class="user-status">Online</div>
            </div>
            <button class="logout-btn" onclick="doLogout()" title="Logout">&#x1F6AA;</button>
        </div>
    </div>
    <div class="chat">
        <div class="chat-header">
            <span class="hash">#</span>
            <span class="name" id="chat-channel-name">general</span>
            <span class="topic" id="chat-channel-topic"></span>
        </div>
        <div class="messages" id="messages"></div>
        <div class="upload-preview" id="upload-preview">
            <div class="preview-card">
                <span id="upload-filename"></span>
                <span class="remove" onclick="clearUpload()">&times;</span>
            </div>
        </div>
        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="msg-input" rows="1" placeholder="Message #general"
                    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>
                <div class="input-btns">
                    <label class="input-btn" title="Upload file">
                        &#x1F4CE;
                        <input type="file" id="file-input" style="display:none" onchange="onFileSelect(this)">
                    </label>
                    <button class="input-btn" onclick="sendMsg()" title="Send">&#x27A4;</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let TOKEN = null;
let USER = null;
let CHANNELS = [];
let currentChannel = null;
let pendingFile = null;
let pollInterval = null;
var USERS = {{ users | tojson }};

function getUserInfo(username) {
    var u = USERS[username];
    if (u) return u;
    return {avatar: (username || '?')[0].toUpperCase(), color: '#747f8d', avatar_url: ''};
}

function api(path, opts) {
    opts = opts || {};
    opts.headers = opts.headers || {};
    if (TOKEN) opts.headers['Authorization'] = 'Bearer ' + TOKEN;
    return fetch(path, opts).then(r => r.json());
}

function doLogin() {
    var u = document.getElementById('login-user').value.trim();
    var p = document.getElementById('login-pass').value;
    var err = document.getElementById('login-error');
    err.style.display = 'none';
    api('/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username: u, password: p})
    }).then(function(data) {
        if (data.error) { err.textContent = data.error; err.style.display = 'block'; return; }
        TOKEN = data.token;
        USER = data.user;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'flex';
        document.getElementById('user-name').textContent = USER.username;
        var ubar = document.getElementById('user-avatar');
        var ui = getUserInfo(USER.username);
        ubar.style.background = ui.color;
        if (ui.avatar_url) {
            ubar.innerHTML = '<img src="' + ui.avatar_url + '" alt="' + ui.avatar + '">';
        } else {
            ubar.textContent = ui.avatar;
        }
        loadChannels();
    });
}

function doLogout() {
    TOKEN = null; USER = null;
    if (pollInterval) clearInterval(pollInterval);
    document.getElementById('app-screen').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('login-pass').value = '';
}

function loadChannels() {
    api('/api/channels').then(function(data) {
        CHANNELS = data.channels;
        var list = document.getElementById('channel-list');
        list.innerHTML = '';
        CHANNELS.forEach(function(ch) {
            var el = document.createElement('div');
            el.className = 'channel-item';
            el.setAttribute('data-id', ch.id);
            el.innerHTML = '<span class="hash">#</span> ' + ch.name;
            el.onclick = function() { selectChannel(ch.id); };
            list.appendChild(el);
        });
        selectChannel('general');
    });
}

function selectChannel(id) {
    currentChannel = id;
    var ch = CHANNELS.find(function(c) { return c.id === id; });
    document.getElementById('chat-channel-name').textContent = ch ? ch.name : id;
    document.getElementById('chat-channel-topic').textContent = ch ? ch.topic : '';
    document.getElementById('msg-input').placeholder = 'Message #' + (ch ? ch.name : id);
    document.querySelectorAll('.channel-item').forEach(function(el) {
        el.classList.toggle('active', el.getAttribute('data-id') === id);
    });
    loadMessages();
    if (pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(loadMessages, 5000);
}

function loadMessages() {
    api('/api/channels/' + currentChannel + '/messages').then(function(data) {
        var container = document.getElementById('messages');
        var wasAtBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 50;
        var frag = document.createDocumentFragment();
        var lastDate = '';
        (data.messages || []).forEach(function(m) {
            var msgDate = new Date(m.created_at * 1000).toLocaleDateString('fr-FR', {day:'numeric',month:'long',year:'numeric'});
            if (msgDate !== lastDate) {
                lastDate = msgDate;
                var today = new Date().toLocaleDateString('fr-FR', {day:'numeric',month:'long',year:'numeric'});
                var yesterday = new Date(Date.now()-86400000).toLocaleDateString('fr-FR', {day:'numeric',month:'long',year:'numeric'});
                var label = msgDate === today ? "Aujourd'hui" : msgDate === yesterday ? 'Hier' : msgDate;
                var divider = document.createElement('div');
                divider.className = 'msg-divider';
                divider.innerHTML = '<hr><span>' + label + '</span><hr>';
                frag.appendChild(divider);
            }
            var uinfo = getUserInfo(m.username);
            var color = uinfo.color;
            var avatarHtml;
            if (uinfo.avatar_url) {
                avatarHtml = '<div class="msg-avatar" style="background:' + color + '"><img src="' + uinfo.avatar_url + '" alt="' + uinfo.avatar + '"></div>';
            } else {
                avatarHtml = '<div class="msg-avatar" style="background:' + color + '">' + uinfo.avatar + '</div>';
            }

            var ts = new Date(m.created_at * 1000);
            var timeStr = ts.toLocaleDateString('fr') + ' ' + ts.toLocaleTimeString('fr', {hour:'2-digit',minute:'2-digit'});

            var attachHtml = '';
            if (m.attachment) {
                var name = m.attachment.name || 'file';
                var isImg = /\.(png|jpe?g|gif|webp)$/i.test(name);
                if (isImg) {
                    attachHtml = '<div class="msg-attachment"><img src="' + m.attachment.url + '" alt="' + name + '"></div>';
                } else {
                    attachHtml = '<div class="msg-attachment"><div class="msg-attachment-file">&#128206; <a href="' + m.attachment.url + '">' + name + '</a></div></div>';
                }
            }

            var deleteBtn = '';
            if (USER && m.username === USER.username) {
                deleteBtn = '<div class="msg-actions"><button class="msg-action-btn" onclick="deleteMsg(\'' + m.id + '\')" title="Delete">&#x1F5D1;</button></div>';
            }

            var div = document.createElement('div');
            div.className = 'msg';
            div.setAttribute('data-id', m.id);
            div.innerHTML =
                deleteBtn +
                avatarHtml +
                '<div class="msg-body">' +
                    '<div class="msg-meta">' +
                        '<span class="msg-user" style="color:' + color + '">' + m.username + '</span>' +
                        '<span class="msg-time">' + timeStr + '</span>' +
                    '</div>' +
                    '<div class="msg-text">' + escapeHtml(m.content) + '</div>' +
                    attachHtml +
                '</div>';
            frag.appendChild(div);
        });
        container.innerHTML = '';
        container.appendChild(frag);
        if (wasAtBottom) container.scrollTop = container.scrollHeight;
    });
}

function deleteMsg(id) {
    if (!confirm('Delete this message?')) return;
    api('/api/channels/' + currentChannel + '/messages/' + id, {method: 'DELETE'}).then(function(data) {
        if (data.status === 'deleted') {
            var el = document.querySelector('.msg[data-id="' + id + '"]');
            if (el) el.remove();
        }
    });
}

function escapeHtml(s) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(s));
    return d.innerHTML;
}

function onFileSelect(input) {
    if (!input.files || !input.files[0]) return;
    pendingFile = input.files[0];
    document.getElementById('upload-filename').textContent = pendingFile.name;
    document.getElementById('upload-preview').style.display = 'block';
}

function clearUpload() {
    pendingFile = null;
    document.getElementById('file-input').value = '';
    document.getElementById('upload-preview').style.display = 'none';
}

function sendMsg() {
    var input = document.getElementById('msg-input');
    var text = input.value.trim();
    if (!text && !pendingFile) return;

    if (pendingFile) {
        var form = new FormData();
        form.append('file', pendingFile);
        fetch('/api/upload', {
            method: 'POST',
            headers: {'Authorization': 'Bearer ' + TOKEN},
            body: form
        }).then(function(r) { return r.json(); }).then(function(upData) {
            api('/api/channels/' + currentChannel + '/messages', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    content: text,
                    attachment_hash: upData.hash,
                    attachment_name: upData.original_name
                })
            }).then(function() {
                input.value = '';
                clearUpload();
                loadMessages();
            });
        });
    } else {
        api('/api/channels/' + currentChannel + '/messages', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({content: text})
        }).then(function() {
            input.value = '';
            loadMessages();
        });
    }
}

document.getElementById('msg-input').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 200) + 'px';
});

document.getElementById('login-pass').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
