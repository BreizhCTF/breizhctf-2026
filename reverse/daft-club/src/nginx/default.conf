# Rate-limiting zone: max 10 req/s per IP, burst of 20
limit_req_zone $binary_remote_addr zone=redeem_limit:10m rate=10r/m;

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html;
    index index.html;

    # --- Security headers ---
    add_header X-Content-Type-Options  "nosniff"          always;
    add_header X-Frame-Options         "DENY"             always;
    add_header X-XSS-Protection        "1; mode=block"    always;
    add_header Referrer-Policy         "no-referrer"      always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'none';" always;

    # Cap POST body size — keys are tiny, 256 B is generous
    client_max_body_size 256;

    # Disable version disclosure (also set in conf.d/security.conf)
    server_tokens off;

    # --- Static page ---
    location = / {
        try_files /index.html =404;
    }

    # Block all traversal attempts and hidden files
    location ~ /\. {
        deny all;
    }

    # Explicitly deny anything that isn't / or /redeem
    location / {
        return 404;
    }

    # --- Redeem endpoint ---
    location = /redeem {
        # Only POST is accepted; all other methods get 405
        limit_except POST { deny all; }

        # Rate limit: 10 requests/min per IP, burst 5, no delay
        limit_req zone=redeem_limit burst=5 nodelay;
        limit_req_status 429;

        include fastcgi_params;
        fastcgi_pass  unix:/run/fcgiwrap.socket;
        fastcgi_param SCRIPT_FILENAME /usr/lib/cgi-bin/validator;
        fastcgi_param REQUEST_METHOD  $request_method;
        fastcgi_param CONTENT_TYPE    $content_type;
        fastcgi_param CONTENT_LENGTH  $content_length;

        # Strip any headers that could trick the CGI
        fastcgi_param HTTP_PROXY "";
    }
}
