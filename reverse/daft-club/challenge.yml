description: |-
  ![wat](https://imgur.com/a/3O6FD7s)
  Les Daft Punk préparent un comeback. Pour fêter ça, ils ont mis en ligne une piste inédite sur le Daft Club — une seule, accessible à une seule personne.
  Le gagnant reçoit une invitation personnelle pour rencontrer le duo.

  Le problème : il n'existe qu'un seul code CD valide au monde. Unique. Gravé dans le silicium.

  Un hacker breton a mis la main sur le binaire qui vérifie les codes.
  Malheureusement, il est déjà au bar. Il vous laisse le boulot.

  Le code CD est quelque part là-dedans. Bonne chance.

  Auteur : [deadc0de](https://discord.com/users/742507022297333760)

