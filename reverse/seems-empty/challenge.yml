name: "Seems Empty"
author: "AntwortEinesLebens"
category: Reverse
description: |-
  ![Empty Landscape](https://media.tenor.com/6gh9BQV36-QAAAAC/tumbleweed-boring.gif)

  Lors d’un audit, un binaire étrange ne faisait qu’afficher un message banal.
  Lors du tri initial, son comportement n'a déclenché aucun indicateur notable : pas d'activité réseau, pas d'écriture suspecte, rien qu'une sortie parfaitement inoffensive.
  Relégué parmi les artefacts sans intérêt, il semble pourtant avoir été altéré par un groupe de malware.

  Même ce qui semble vide peut cacher un secret.

  Auteur : [AntwortEinesLebens](https://discord.com/users/776058684760522762)

attribution: 'Auteur : [AntwortEinesLebens](https://discord.com/users/776058684760522762)'

