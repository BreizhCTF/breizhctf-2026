name: "Kybeurre salé"
author: "Korabal"
category: Crypto
description: |-
    ![make-compliance-sexy-again](https://media.tenor.com/Ns-juEQlpkwAAAAC/tenor.gif)

    Tu as fait forte impression auprès de la CNIL. J'ai l'impression que GPT-Erwann en est hereux.

