name: "Tremendous - Accès VIP : Sans limites [1/2]"
author: "Korabal"
category: Crypto
description: |-
    ![Huge](https://media.tenor.com/TKDLj5DR1_EAAAAC/tenor.gif)

    Quelqu'un d'excessivement volubile (et fier de lui même) vous parle. Vous avez entendu "Pour télécharger notre application, et obtenir votre ticket, ... portal VIP ... modulo ... tournent pas en rond ... Purs ... Je l'ai viré sur-le-champ.".

    *Note: pas de dépendances techniques entre les challenges. Juste du lore.*

    Auteur : [Korabal](https://discord.com/users/1362851325615800573)

attribution: 'Auteur : [Korabal](https://discord.com/users/1362851325615800573)'

# Liste des fichiers à fournirs aux joueurs
files:
    - files/challenge.py
    - files/leak.txt
    - files/README.md

flags:
    - BZHCTF{we_have_the_biggest_numbers_peri0d}

# Dépendence avec d'autres challenges
# requirements:
#     - "Warmup"
