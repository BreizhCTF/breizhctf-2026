<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💎 PRANACOIN-MAX-ROI: THE FUTURE OF WEALTH 💎</title>
    <style>
        @keyframes rainbow {
            0% { color: #ff0000; }
            20% { color: #ffff00; }
            40% { color: #00ff00; }
            60% { color: #00ffff; }
            80% { color: #0000ff; }
            100% { color: #ff00ff; }
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(255,215,0,0.5); }
            50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(255,215,0,0.8); }
            100% { transform: scale(1); box-shadow: 0 0 10px rgba(255,215,0,0.5); }
        }

        @keyframes slideIn {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        body {
            font-family: 'Comic Sans MS', 'Impact', sans-serif;
            background: #000;
            background-image: 
                radial-gradient(circle at 20% 30%, #1a1a2e 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, #16213e 0%, transparent 40%);
            color: #fff;
            text-align: center;
            padding: 2rem;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.7);
            border: 4px solid #ffd700;
            border-radius: 30px;
            padding: 3rem;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.3);
        }
        
        h1 {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
            animation: rainbow 2s infinite linear;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .subtitle {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: #00ff00;
            font-weight: bold;
            text-shadow: 0 0 5px #00ff00;
        }
        
        .button-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 2rem;
        }

        .button {
            background: linear-gradient(45deg, #ffd700, #ff8c00);
            color: #000;
            border: none;
            padding: 1.5rem 3rem;
            font-size: 1.5rem;
            font-weight: 900;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        
        .button:hover:not(:disabled) {
            transform: scale(1.1) rotate(2deg);
            filter: brightness(1.2);
        }
        
        .button:disabled {
            filter: grayscale(1);
            cursor: wait;
            opacity: 0.5;
        }

        #withdrawBtn {
            background: linear-gradient(45deg, #00ff00, #008000);
            animation: pulse 1.5s infinite;
        }
        
        .output {
            margin-top: 2rem;
            padding: 1.5rem;
            background: #111;
            border-left: 5px solid #ffd700;
            border-radius: 5px;
            min-height: 150px;
            text-align: left;
            overflow-y: auto;
            max-height: 400px;
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
        }
        
        .log-entry {
            margin-bottom: 8px;
            animation: slideIn 0.3s ease-out;
        }

        .info { color: #aaa; }
        .success { color: #00ff00; font-weight: bold; }
        .error { color: #ff0000; font-weight: bold; }
        .hype { color: #ffd700; font-weight: bold; text-transform: uppercase; }
        .connecting { color: #00ffff; animation: rainbow 1s infinite linear; }
        
        .nft-preview {
            margin: 2rem 0;
            padding: 2rem;
            background: linear-gradient(135deg, #333 0%, #000 100%);
            border: 2px dashed #ffd700;
            border-radius: 20px;
            display: none;
            position: relative;
            overflow: hidden;
        }

        .nft-sparkle {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            background-image: radial-gradient(circle, #fff 1px, transparent 1px);
            background-size: 50px 50px;
            animation: pulse 2s infinite;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            margin-bottom: 2rem;
            padding: 1rem;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-val {
            font-size: 1.5rem;
            color: #ffd700;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💎  PRANACOIN-MAX-ROI 💎</h1>
        <div class="subtitle">🚀 WEALTH ACCELERATION PROTOCOL V4.2 🚀</div>
        
        <div class="stats-bar">
            <div class="stat-item">
                <span class="stat-val">1000x</span>
                <span class="stat-label">Min ROI</span>
            </div>
            <div class="stat-item">
                <span class="stat-val">QUANTUM</span>
                <span class="stat-label">AI ENGINE</span>
            </div>
            <div class="stat-item">
                <span class="stat-val" id="totalWealth">0.00 ETH</span>
                <span class="stat-label">TOTAL WEALTH MANIFESTED</span>
            </div>
        </div>

        <div class="button-container">
            <button class="button" id="mintBtn">🎨 MANIFEST RICHES (MINT)</button>
            <button class="button" id="withdrawBtn">💰 RETIRE NOW (WITHDRAW)</button>
        </div>
        
        <div class="nft-preview" id="nftPreview">
            <div class="nft-sparkle"></div>
            <h2 style="color: #ffd700">✨ UNRIVALED DIGITAL ASSET MANIFESTED ✨</h2>
            <div id="nftContent" style="font-size: 1.2rem; line-height: 1.6;">Preparing your ticket to the moon...</div>
        </div>
        
        <div class="output" id="output">
            <div class="log-entry connecting">INITIALIZING QUANTUM WEALTH TUNNEL...</div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
