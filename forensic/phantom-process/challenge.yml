name: "Phantom Process"
author: "Lamarr"
category: Forensic
description: |-
    ![ghost](https://media.tenor.com/NarRX0m-o1IAAAAi/halloween-ghost.gif)

    Le serveur d'opérations de **Breizh Aero Survey** (`ops-srv01`) présente un comportement réseau suspect depuis quelques jours : des connexions HTTPS sortantes régulières vers une IP inconnue.

    L'équipe IT a capturé un dump mémoire avec LiME avant d'isoler la machine.

    Votre mission :

     - Identifiez le vecteur d'infection initianl
     - Retrouvez l'implant qui tourne sur le serveur
     - Extrayez le flag depuis les données exfiltrées

     Auteur : [Lamarr](https://discord.com/users/361136527709044737)

attribution: 'Auteur : [Lamarr](https://discord.com/users/361136527709044737)'

