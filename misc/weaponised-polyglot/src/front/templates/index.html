<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weaponised Polyglot</title>
    <link rel="stylesheet" data-name="vs/editor/editor.main" href="{{ url_for('static', filename='assets/monaco/min/vs/editor/editor.main.css') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        .header {
            background-color: #252526;
            padding: 15px 20px;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 18px;
            font-weight: 600;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        select {
            background-color: #3c3c3c;
            color: #d4d4d4;
            border: 1px solid #3e3e42;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        
        select:hover {
            background-color: #454545;
        }
        
        button {
            background-color: #0e639c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        
        button:hover {
            background-color: #1177bb;
        }
        
        button:active {
            background-color: #0d5a8f;
        }
        
        .editor-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        
        #editor {
            flex: 1;
        }
        
        .result-panel {
            width: 40%;
            border-left: 1px solid #3e3e42;
            display: flex;
            flex-direction: column;
            background-color: #1e1e1e;
        }
        
        .result-header {
            background-color: #252526;
            padding: 10px 15px;
            border-bottom: 1px solid #3e3e42;
            font-size: 13px;
            font-weight: 600;
        }
        
        .explanation-section {
            flex: 0.4;
            border-bottom: 1px solid #3e3e42;
            overflow: auto;
            padding: 15px;
            font-size: 20px;
            color: #d4d4d4;
            background-color: #252526;
        }
        
        .explanation-section h3 {
            margin-bottom: 8px;
            font-size: 18px;
            color: #ce9178;
        }
        
        .explanation-content {
            font-size: 18px;
            line-height: 1.5;
            color: #b4b4b4;
        }
        
        .output-section {
            flex: 0.6;
            border-top: 1px solid #3e3e42;
            overflow: auto;
            display: flex;
            flex-direction: column;
        }
        
        .output-header {
            background-color: #252526;
            padding: 10px 15px;
            border-bottom: 1px solid #3e3e42;
            font-size: 13px;
            font-weight: 600;
        }
        
        #result {
            flex: 1;
            overflow: auto;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-all;
            color: #d4d4d4;
        }
        
        .result-success {
            color: #4ec9b0;
        }
        
        .result-error {
            color: #f48771;
        }
        
        .loading {
            color: #ce9178;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Weaponised Polyglot</h1>
            <div class="controls">
                <select id="languageSelect">
                    <option value="python">Python</option>
                    <option value="sql">SQL</option>
                    <option value="shell">Bash</option>
                    <option value="ruby">Ruby</option>
                    <option value="perl">Perl</option>
                    <option value="lua">Lua</option>
                    <option value="php">PHP</option>
                    <option value="all">ALL LANGUAGES</option>
                </select>
                <button id="executeBtn">Execute</button>
            </div>
        </div>
        
        <div class="editor-container">
            <div id="editor"></div>
            <div class="result-panel">
                <div class="explanation-section">
                    <h3>Explanation</h3>
                    <div class="explanation-content" id="explanation">
                        Select a language and write your code, then click Execute to run it and see the output below.
                    </div>
                </div>
                <div class="output-section">
                    <div class="output-header">Output</div>
                    <div id="result"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='assets/monaco/min/vs/loader.js') }}"></script>
    <script>
        require.config({ paths: { 'vs': '{{ url_for("static", filename="assets/monaco/min/vs") }}' } });
        
        let editor;
        const resultDiv = document.getElementById('result');
        const explanationDiv = document.getElementById('explanation');
        const languageSelect = document.getElementById('languageSelect');
        const executeBtn = document.getElementById('executeBtn');
        
        // Language information
        const languageInfo = {
            'python': 'You need to read <code>flag.txt</code> using Python 3.<br>There are no limitations.',
            'sql': 'You need to read <code>flag.txt</code> using SQL.<br>There are no limitations.<br>SQL is ran by SQLite version 3.<br>The SQL is SQLite flavored.',
            'shell': 'You need to read <code>flag.txt</code> using Bash.<br>There are no limitations.',
            'ruby': 'You need to read <code>flag.txt</code> using Ruby.<br>There are no limitations.',
            'perl': 'You need to read <code>flag.txt</code> using Perl 5.34.<br>There are no limitations.',
            'lua': 'You need to read <code>flag.txt</code> using Lua 5.3.<br>There are no limitations.',
            'php': 'You need to read <code>flag.txt</code> using PHP 8.1.<br>There are no limitations.<br>Your program is ran by php cli as a php page.<br>You will need the php tags to run your php.',
            'all': 'All languages are ran one after the other.<br>All must print out the flag.'
        };

        explanationDiv.innerHTML = languageInfo[languageSelect.value];
        
        // Load code from localStorage
        function loadCode() {
            const savedCode = localStorage.getItem('polyglot-code');
            return savedCode || '# Write your code here\n';
        }
        
        // Save code to localStorage
        function saveCode() {
            const code = editor.getValue();
            localStorage.setItem('polyglot-code', code);
        }
        
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: loadCode(),
                language: 'python',
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 14,
                fontFamily: "'Fira Code', 'Courier New', monospace",
                formatOnPaste: true,
                formatOnType: true,
                minimap: { enabled: true }
            });
            
            // Save code whenever it changes
            editor.onDidChangeModelContent(() => {
                saveCode();
            });
        });
        
        languageSelect.addEventListener('change', (e) => {
            const languageMap = {
                'python': 'python',
                'sql': 'sql',
                'shell': 'shell',
                'ruby': 'ruby',
                'perl': 'perl',
                'lua': 'lua',
                'php': 'php',
                'all': 'python'
            };
            
            monaco.editor.setModelLanguage(editor.getModel(), languageMap[e.target.value]);
            
            // Update explanation
            explanationDiv.innerHTML = languageInfo[e.target.value];
        });
        
        executeBtn.addEventListener('click', async () => {
            const code = editor.getValue();
            const language = languageSelect.value;
            
            resultDiv.textContent = 'Executing...';
            resultDiv.className = 'loading';
            
            try {
                const response = await fetch('/run', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        code: code,
                        language: language
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = atob(data.output);
                    resultDiv.className = 'result-success';
                } else {
                    resultDiv.textContent = JSON.stringify(data, null, 2);
                    resultDiv.className = 'result-error';
                }
            } catch (error) {
                resultDiv.textContent = 'Error: ' + error.message;
                resultDiv.className = 'result-error';
            }
        });
    </script>
</body>
</html>
