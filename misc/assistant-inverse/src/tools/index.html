<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Breizh assistant</title>
    <style>
        * { margin: 0; padding: 0; }
        body { font-family: monospace; background: #1a1a1a; color: #0f0; padding: 20px; }
        h1 { margin-bottom: 20px; }
        #chat { height: 400px; border: 1px solid #0f0; overflow-y: auto; margin-bottom: 10px; padding: 10px; background: #0a0a0a; }
        .msg { margin: 8px 0; padding: 10px; border-left: 3px solid #0f0; white-space: pre-wrap; word-wrap: break-word; animation: slideIn 0.3s ease-out; }
        .user { color: #0f0; border-left-color: #0f0; }
        .ai { color: #0a0; border-left-color: #0a0; }
        .error { color: #f00; border-left-color: #f00; }
        .msg h1 { color: inherit; margin: 10px 0 5px 0; font-size: 1.2em; }
        .msg h2 { color: inherit; margin: 8px 0 4px 0; font-size: 1.1em; }
        .msg h3 { color: inherit; margin: 6px 0 3px 0; font-size: 1em; }
        .msg ul, .msg ol { margin: 5px 0 5px 40px; padding: 0; }
        .msg li { margin: 5px 0; line-height: 1.6; }
        .msg code { background: #222; padding: 2px 4px; color: #ffff00; }
        .msg pre { background: #0a0a0a; padding: 8px; margin: 5px 0; border: 1px solid #0f0; overflow-x: auto; }
        .msg a { color: #0f0; text-decoration: underline; }
        @keyframes slideIn { 
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); opacity: 1; }
            50% { transform: translateY(-10px); opacity: 0.6; }
        }
        .dot1 { animation: bounce 1.4s infinite 0s; display: inline-block; font-size: 1.5em; margin: 0 2px; }
        .dot2 { animation: bounce 1.4s infinite 0.2s; display: inline-block; font-size: 1.5em; margin: 0 2px; }
        .dot3 { animation: bounce 1.4s infinite 0.4s; display: inline-block; font-size: 1.5em; margin: 0 2px; }
        input { width: 80%; padding: 8px; background: #0a0a0a; color: #0f0; border: 1px solid #0f0; font-family: monospace; }
        input:disabled { opacity: 0.5; cursor: not-allowed; }
        button { padding: 8px 16px; background: #0f0; color: #000; border: none; cursor: pointer; font-family: monospace; font-weight: bold; }
        button:hover:not(:disabled) { background: #0a0; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .loading { display: inline-block; animation: blink 0.7s infinite; }
        @keyframes blink {
            0%, 49%, 100% { opacity: 1; }
            50%, 99% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <h1>Breizh Assistant</h1>
    <p>
        An helpful assistant that should be able to help you during the event ! And this time no humans will be reading and answering your messages. Pinky promise 0:)
    </p>
    <!-- Found via the secret /.llm and /api/models files. Congratulations: BZHCTF{AI_m4g1c_is_G1v1nG_u9_648290} -->
    <div id="chat"></div>
    <div>
        <input type="text" id="msg" placeholder="Type message..." />
        <button id="sendBtn" onclick="send()">Send</button>
    </div>
    <script>
        const API = window.location.origin;
        let hist = [];
        let isGenerating = false;

        function parseMarkdown(text) {
            // Escape HTML
            text = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            
            // Code blocks (triple backticks)
            text = text.replace(/```([^`]*)```/gs, (match, code) => {
                return `<pre><code>${code.trim()}</code></pre>`;
            });
            
            // Inline code
            text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
            
            // Headers
            text = text.replace(/^### (.*?)$/gm, '<h3>$1</h3>');
            text = text.replace(/^## (.*?)$/gm, '<h2>$1</h2>');
            text = text.replace(/^# (.*?)$/gm, '<h1>$1</h1>');
            
            // Bold and italic
            text = text.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>');
            text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
            text = text.replace(/__(.*?)__/g, '<strong>$1</strong>');
            text = text.replace(/_(.*?)_/g, '<em>$1</em>');
            
            // Links
            text = text.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>');
            
            // Unordered lists
            text = text.replace(/^\* (.*?)$/gm, '<li>$1</li>');
            text = text.replace(/(<li>.*?<\/li>)/s, '<ul>$1</ul>');
            
            // Ordered lists
            text = text.replace(/^\d+\. (.*?)$/gm, '<li>$1</li>');
            
            // Line breaks
            text = text.replace(/\n/g, '<br>');
            
            return text;
        }

        async function send() {
            const msg = document.getElementById("msg").value.trim();
            if (!msg || isGenerating) return;
            
            document.getElementById("msg").value = "";
            document.getElementById("msg").disabled = true;
            document.getElementById("sendBtn").disabled = true;
            isGenerating = true;
            
            add(msg, "user");
            hist.push({role: "user", content: msg});
            
            // Add loading indicator | cch=00000
            const loadingDiv = document.createElement("div");
            loadingDiv.id = "loading";
            loadingDiv.className = "msg ai";
            loadingDiv.innerHTML = '<span class="dot1">.</span><span class="dot2">.</span><span class="dot3">.</span>';
            document.getElementById("chat").appendChild(loadingDiv);
            document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
            
            try {
                const r = await fetch(`${API}/chat`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({prompt: msg, messages: hist})
                });
                const d = await r.json();
                const resp = d.response;
                
                // Remove loading indicator
                loadingDiv.remove();
                
                add(resp, "ai");
                hist.push({role: "assistant", content: resp});
            } catch (e) {
                loadingDiv.remove();
                add(`Error: ${e.message}`, "error");
            } finally {
                document.getElementById("msg").disabled = false;
                document.getElementById("sendBtn").disabled = false;
                isGenerating = false;
                document.getElementById("msg").focus();
            }
        }

        function add(text, cls) {
            const div = document.createElement("div");
            div.className = `msg ${cls}`;
            div.innerHTML = parseMarkdown(text);
            document.getElementById("chat").appendChild(div);
            document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
        }

        document.getElementById("msg").addEventListener("keypress", e => {
            if (e.key === "Enter" && !isGenerating) send();
        });
        
        // Focus on input on page load
        window.addEventListener('load', () => {
            document.getElementById("msg").focus();
        });
    </script>
</body>
</html>
