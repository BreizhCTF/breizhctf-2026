name: "KVMillésime - Vendanges tardives [1/3]"
author: "Korabal"
category: Misc
description: |-
    ![Oracle quantique](https://media.tenor.com/EIcYaOkm8KAAAAAd/tenor.gif)

    PranaCorp prétend avoir bâti un oracle impossible à manipuler, même dans un environnement virtualisé.
    Infiltrez leur infra, exploitez la mécanique de snapshot, puis remontez l'état interne du générateur
    pour retrouver le secret avant la levée de fonds.

    Auteur : [Korabal](https://discord.com/users/1362851325615800573)

attribution: 'Auteur : [Korabal](https://discord.com/users/1362851325615800573)'

